# LiturgyFlow (Verbum) — Render Blueprint
# Repo: https://github.com/divinogabriel9/verbum
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/divinogabriel9/verbum

services:
  - type: keyvalue
    name: verbum-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: verbum
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Deploy identity: Render sets RENDER_GIT_COMMIT / RENDER_GIT_BRANCH automatically.
      # Optional human label (e.g. 2026.07.12) shown alongside the short SHA in the UI.
      - key: APP_VERSION
        sync: false
      # Render injects RENDER_EXTERNAL_URL; auth_config uses it when APP_PUBLIC_URL is unset.
      - key: REDIS_URL
        fromService:
          name: verbum-cache
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: HCAPTCHA_SITE_KEY
        sync: false
      - key: HCAPTCHA_SECRET_KEY
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: INVITE_ONLY_SIGNUP
        value: "1"
      - key: INVITE_CONTACT_EMAIL
        sync: false
      - key: ACCESS_REQUEST_TO
        value: divinogabriel76@gmail.com
      # Brevo transactional (API recommended — see .env.example setup order)
      - key: EMAIL_TRANSPORT
        value: "brevo_api"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_LOGO_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_REMINDERS_ENABLED
        value: "1"
      - key: CRON_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: IMAGE_GENERATION_WEEKLY_LIMIT
        value: "5"
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: RATE_LIMIT_AUTH_MAX
        value: "30"
      - key: RATE_LIMIT_AUTH_WINDOW
        value: "60"
      - key: RATE_LIMIT_EXPENSIVE_MAX
        value: "20"
      - key: RATE_LIMIT_EXPENSIVE_WINDOW
        value: "60"
      - key: RATE_LIMIT_API_MAX
        value: "120"
      - key: RATE_LIMIT_API_WINDOW
        value: "60"
      - key: RATE_LIMIT_DEFAULT_MAX
        value: "300"
      - key: RATE_LIMIT_DEFAULT_WINDOW
        value: "60"
      - key: RATE_LIMIT_PRACTICE_TOKEN_MAX
        value: "2400"
      - key: RATE_LIMIT_PRACTICE_TOKEN_WINDOW
        value: "3600"
      - key: PRACTICE_PIN_PBKDF2_ROUNDS
        value: "8000"
      - key: PRACTICE_UNLOCK_MAX_CONCURRENT
        value: "16"
      - key: MAX_REQUEST_BODY_BYTES
        value: "12582912"
      - key: PRACTICE_UNLOCK_SECRET
        sync: false
      - key: SONG_WEB_FETCH
        value: "0"
      - key: CATALOG_LYRIC_FETCH_MAX
        value: "60"
      - key: CATALOG_LYRIC_FETCH_WINDOW
        value: "3600"
      # Base64 Netscape YouTube cookies — required for SA preview fetch on Render IPs
      - key: YTDLP_COOKIES_B64
        sync: false

  # Once daily (06:00 Asia/Seoul = 21:00 UTC). Sweeps every Sunday in the
  # current civil year; only missing/unhealthy dates are live-fetched. Hits the
  # web service so readings land on the live cache — not the cron ephemeral disk.
  # Starter plan required for cron on Render (free web dyno is fine to target).
  - type: cron
    name: verbum-readings-autofetch
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 21 * * *"
    dockerCommand: python scripts/cron_curl_readings_autofetch.py
    envVars:
      - key: APP_PUBLIC_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: READINGS_AUTOFETCH_ATTEMPTS
        value: "3"
      - key: READINGS_AUTOFETCH_WINDOW
        value: "year"
      - key: READINGS_AUTOFETCH_SCOPE
        value: "missing"
      - key: READINGS_AUTOFETCH_ALERT
        value: "1"
      - key: READINGS_AUTOFETCH_TIMEOUT_S
        value: "1800"

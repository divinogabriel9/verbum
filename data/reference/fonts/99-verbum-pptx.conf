<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Map PPTX font names (python-pptx) to fonts available in the Render/Docker image. -->
<fontconfig>
  <!-- Deck uses family name "Poppins Bold" (not Poppins + bold flag). -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Poppins Bold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Poppins</string>
    </edit>
    <edit name="weight" mode="assign" binding="strong">
      <const>bold</const>
    </edit>
  </match>

  <!-- Georgia is proprietary; Liberation Serif is the usual LO substitute. -->
  <alias binding="same">
    <family>Georgia</family>
    <prefer>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Arial Black</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
    <edit name="weight" mode="assign" binding="strong">
      <const>bold</const>
    </edit>
  </match>

  <!-- Calibri → Carlito (metric-compatible, OFL via fonts-crosextra-carlito). -->
  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>
</fontconfig>
